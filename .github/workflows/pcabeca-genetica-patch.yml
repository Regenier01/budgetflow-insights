name: Apply P/Cabeca Genetica patch

on:
  push:
    branches:
      - chatgpt/pcabeca-genetica

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pcabeca-genetica-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pcabeca-genetica
          fetch-depth: 0

      - name: Apply surgical patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/ActivityDetailPage.tsx')
          text = path.read_text(encoding='utf-8')

          title = 'title="Detalhamento de Custos Genética"'
          if text.count(title) != 1:
              raise SystemExit(f'Esperado exatamente 1 bloco de Custos Genética; encontrado: {text.count(title)}')

          title_pos = text.index(title)
          block_start = text.rfind('<AnalyticalTable', 0, title_pos)
          block_end = text.index('/>', title_pos) + 2
          if block_start < 0:
              raise SystemExit('Início do AnalyticalTable de Custos Genética não encontrado')

          block = text[block_start:block_end]
          old_department = 'departmentFilter={selectedDepts.length > 0 ? selectedDepts : undefined}'
          new_department = "departmentFilter={selectedDepts.length > 0 ? selectedDepts : ['CENTRO COMERCIAL DE TOUROS']}"

          if block.count(old_department) != 1:
              raise SystemExit(f'Filtro de departamento esperado não encontrado exatamente uma vez no bloco: {block.count(old_department)}')
          if 'showPCabecaColumns' in block:
              raise SystemExit('showPCabecaColumns já existe no bloco; abortando para evitar alteração duplicada')
          if 'costHierarchyMode="grupo_descricao"' not in block:
              raise SystemExit('Âncora costHierarchyMode não encontrada no bloco')

          block = block.replace(old_department, new_department, 1)
          block = block.replace(
              'accentColor="orange"\n                costHierarchyMode="grupo_descricao"',
              'accentColor="orange"\n                showPCabecaColumns\n                costHierarchyMode="grupo_descricao"',
              1,
          )

          updated = text[:block_start] + block + text[block_end:]
          if updated == text:
              raise SystemExit('Nenhuma alteração foi aplicada')

          path.write_text(updated, encoding='utf-8')

      - name: Validate scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "src/pages/ActivityDetailPage.tsx"
          git diff -- src/pages/ActivityDetailPage.tsx

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ActivityDetailPage.tsx
          git commit -m "feat: exibir P/Cabeça em Custos Genética [pcabeca-genetica-applied]"
          git push origin HEAD:chatgpt/pcabeca-genetica
